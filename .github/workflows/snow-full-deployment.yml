name: Simulated Production Deployment

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      version:
        required: true
        type: string
        default: 'v1.0.0-poc'

jobs:
  # JOB 1: Create ServiceNow Change (prod only)
  create_snow_change:
    name: Create ServiceNow Change
    if: ${{ inputs.env == 'prod' }}
    runs-on: ubuntu-latest # in ADO this would be pool
    env:
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USERNAME: ${{ secrets.SN_USERNAME }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
      SN_STD_TEMPLATE_SYSID: ${{ secrets.SN_STD_TEMPLATE_SYSID }}
    outputs:
      chg_sysid: ${{ steps.output_vars.outputs.chg_sysid }}
      chg_number: ${{ steps.output_vars.outputs.chg_number }}
      chg_description: ${{ steps.output_vars.outputs.chg_description }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - run: pip install requests
      
      - name: Create and schedule change
        id: output_vars
        run: python scripts/create_std_change.py
      
      - name: Move to Scheduled
        env:
          SN_CHG_SYSID: ${{ steps.output_vars.outputs.chg_sysid }}
          SN_TARGET_STATE: "-2"
        run: python scripts/patch_state.py

  # JOB 2: Deploy Application
  deploy_application:
    name: Deploy to ${{ inputs.env }}
    runs-on: ubuntu-latest
    env:
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USERNAME: ${{ secrets.SN_USERNAME }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
    needs: 
      - create_snow_change
    if: always() # because it runs for all envs but only creates change for prod
    steps:
      - uses: actions/checkout@v4   

      - name: Setup Python
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - name: Move Change to Implement
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        env:
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
          SN_TARGET_STATE: "-1"
        run: |
          pip install requests docxtpl
          python scripts/patch_state.py
      
      - name: Get Implement task
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        id: get_task
        env:
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
        run: python scripts/get_tasks.py
      
      - name: Parse CHANGELOG
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        id: parse_changelog
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/parse_changelog.py
      
      - name: Fill DOCX template
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        env:
          CHG_NUMBER: ${{ needs.create_snow_change.outputs.chg_number }}
          CHG_DESCRIPTION: ${{ needs.create_snow_change.outputs.chg_description }}
          BACKEND_SCOPE: ${{ steps.parse_changelog.outputs.backend_scope }}
          DATA_SCOPE: ${{ steps.parse_changelog.outputs.data_scope }}
          FRONTEND_SCOPE: ${{ steps.parse_changelog.outputs.frontend_scope }}
        run: python scripts/fill_template.py
      
      - name: Upload DOCX template to task
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        env:
          SN_TASK_SYSID: ${{ steps.get_task.outputs.implement_task_sysid }}
          EVIDENCE_FILE_PATH: Service_Validation_And_Testing_DRAFT.docx
        run: python scripts/upload_attachment.py
      
      - name: Close Implement task
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        env:
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
          SN_TASK_SYSID: ${{ steps.get_task.outputs.implement_task_sysid }}
        run: python scripts/close_task.py
      
      - name: "[PLACEHOLDER] Deploy Application"
        run: |
          echo "Deploying ${{ inputs.version }} to ${{ inputs.env }}..."
          sleep 2
          echo "Deployment complete"
      
  # JOB 3: Finalize ServiceNow Change (prod only)
  finalize_snow_change:
    name: Update ServiceNow Change
    if: ${{ always() && inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USERNAME: ${{ secrets.SN_USERNAME }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
    needs:
      - create_snow_change
      - deploy_application
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - run: pip install requests
      
      - name: Move to Review State (if deployment succeeded)
        if: ${{ needs.deploy_application.result == 'success' }}
        continue-on-error: true
        env:
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
          SN_TARGET_STATE: "0"
        run: python scripts/patch_state.py