name: Simulated Production Deployment

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      version:
        description: 'Version/Tag (e.g., v1.2.3)'
        required: true
        type: string
        default: 'v1.0.0-poc'

jobs:
  # ============================================
  # JOB 1: Create ServiceNow Change (prod only)
  # ============================================
  create_snow_change:
    name: Create ServiceNow Change
    if: ${{ inputs.env == 'prod' }}
    runs-on: ubuntu-latest
    outputs:
      chg_sysid: ${{ steps.output_vars.outputs.chg_sysid }}
      chg_number: ${{ steps.output_vars.outputs.chg_number }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - run: pip install requests
      
      - name: Create Standard Change
        id: create_change
        env:
          SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
          SN_STD_TEMPLATE_SYSID: ${{ secrets.SN_STD_TEMPLATE_SYSID }}
        run: |
          echo "Creating Standard Change for ${{ inputs.env }} deployment..."
          python scripts/create_std_change.py > output.txt
          cat output.txt
      
      - name: Capture Change Identifiers
        id: output_vars
        run: |
          CHG_SYSID=$(grep "sys_id:" output.txt | awk '{print $2}')
          CHG_NUMBER=$(grep "CHG:" output.txt | awk '{print $2}')
          echo "chg_sysid=$CHG_SYSID" >> $GITHUB_OUTPUT
          echo "chg_number=$CHG_NUMBER" >> $GITHUB_OUTPUT
          echo "✓ Created: $CHG_NUMBER (sys_id: $CHG_SYSID)"
      
      - name: Move to Scheduled
        env:
          SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
          SN_CHG_SYSID: ${{ steps.output_vars.outputs.chg_sysid }}
          SN_TARGET_STATE: "-2"
        run: |
          echo "Moving change to Scheduled state..."
          python scripts/patch_state.py

  # ============================================
  # JOB 2: Deploy Application
  # ============================================
  deploy_application:
    name: Deploy to ${{ inputs.env }}
    runs-on: ubuntu-latest
    needs: 
      - create_snow_change
    # Always run for dev/qa, run for prod after snow change created
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      # Move to Implement state (prod only, before deployment)
      - name: Move Change to Implement
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - name: Install requests
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        run: pip install requests
      
      - name: Patch to Implement State
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        env:
          SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
          SN_TARGET_STATE: "-1"
        run: |
          echo "Moving change to Implement state..."
          python scripts/patch_state.py
      
      # ===== PLACEHOLDER: Your actual deployment steps =====
      - name: "[PLACEHOLDER] Pull Docker Image"
        run: |
          echo "========================================="
          echo "DEPLOYMENT PLACEHOLDER"
          echo "========================================="
          echo "Environment: ${{ inputs.env }}"
          echo "Version: ${{ inputs.version }}"
          echo ""
          echo "In real ADO pipeline, this would be:"
          echo "  - template: shared-templates/deploy-to-appservice.yaml@shared"
          echo "    parameters:"
          echo "      env: ${{ inputs.env }}"
          echo "      dockerTag: ${{ inputs.version }}"
          echo ""
          echo "Simulating deployment..."
          sleep 3
      
      - name: "[PLACEHOLDER] Deploy to App Service"
        run: |
          echo "✓ Deployment to ${{ inputs.env }} complete"
          echo "Image: accio-app-ui:${{ inputs.version }}"
      
      # Optional: simulate deployment failure for testing
      # Uncomment to test failure handling:
      # - name: "[TEST] Simulate Deployment Failure"
      #   run: |
      #     echo "Simulating deployment failure..."
      #     exit 1

  # ============================================
  # JOB 3: Finalize ServiceNow Change (prod only)
  # ============================================
  finalize_snow_change:
    name: Update ServiceNow Change
    if: ${{ always() && inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - create_snow_change
      - deploy_application
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - run: pip install requests
      
      - name: Update Work Notes and Closure Fields
        env:
          SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
          DEPLOYMENT_SUCCESS: ${{ needs.deploy_application.result == 'success' }}
          VERSION: ${{ inputs.version }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os, requests, json
          from datetime import datetime
          
          success = os.environ['DEPLOYMENT_SUCCESS'] == 'true'
          version = os.environ['VERSION']
          pipeline_url = os.environ['PIPELINE_URL']
          
          timestamp = datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
          
          if success:
              status = "✓ SUCCESSFUL"
              close_code = "successful"
          else:
              status = "✗ FAILED"
              close_code = "unsuccessful"
          
          notes = f"""[{timestamp}] Deployment {status}
          
          Version: {version}
          Environment: prod
          Pipeline: {pipeline_url}
          
          {"Deployment completed successfully." if success else "Deployment failed. Check pipeline logs for details."}
          """
          
          url = f"{os.environ['SN_INSTANCE']}/api/sn_chg_rest/change/standard/{os.environ['SN_CHG_SYSID']}"
          payload = {
              "work_notes": notes,
              "close_code": close_code,
              "close_notes": notes
          }
          
          print(f"Updating change {os.environ['SN_CHG_SYSID']}...")
          print(f"Status: {status}")
          
          r = requests.patch(
              url,
              auth=(os.environ['SN_USERNAME'], os.environ['SN_PASSWORD']),
              headers={"Content-Type": "application/json"},
              json=payload
          )
          
          print(f"Update status: {r.status_code}")
          if r.status_code not in [200, 201]:
              print(f"ERROR: {r.text[:500]}")
              exit(1)
          
          print("✓ Work notes and closure fields updated")
          EOF
      
      - name: Move to Review State (if deployment succeeded)
        if: ${{ needs.deploy_application.result == 'success' }}
        env:
          SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
          SN_TARGET_STATE: "0"
        run: |
          echo "Attempting to move change to Review state..."
          python scripts/patch_state.py || echo "⚠ Could not transition to Review - may require manual approval/tasks"
      
      - name: Summary
        run: |
          echo "========================================="
          echo "FINALIZATION COMPLETE"
          echo "========================================="
          echo "Change: ${{ needs.create_snow_change.outputs.chg_number }}"
          echo "Deployment: ${{ needs.deploy_application.result }}"
          echo ""
          echo "View in ServiceNow:"
          echo "${{ secrets.SN_INSTANCE }}/change_request.do?sys_id=${{ needs.create_snow_change.outputs.chg_sysid }}"
