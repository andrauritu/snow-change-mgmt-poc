name: Simulated Production Deployment

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      version:
        required: true
        type: string
        default: 'v1.0.0-poc'
      use_sharepoint:
        description: 'Use SharePoint for template storage (requires credentials)'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

jobs:
  # JOB 1: Create ServiceNow Change (prod only)
  create_snow_change:
    name: Create ServiceNow Change
    if: ${{ inputs.env == 'prod' }}
    runs-on: ubuntu-latest # in ADO this would be pool
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USERNAME: ${{ secrets.SN_USERNAME }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
      SN_STD_TEMPLATE_SYSID: ${{ secrets.SN_STD_TEMPLATE_SYSID }}
    outputs:
      chg_sysid: ${{ steps.output_vars.outputs.chg_sysid }}
      chg_number: ${{ steps.output_vars.outputs.chg_number }}
      chg_description: ${{ steps.output_vars.outputs.chg_description }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - run: pip install -r requirements.txt
      
      - name: Create and schedule change
        id: output_vars
        run: python scripts/servicenow/create_std_change.py
      
      - name: Move to Scheduled
        env:
          SN_CHG_SYSID: ${{ steps.output_vars.outputs.chg_sysid }}
          SN_TARGET_STATE: "-2"
        run: python scripts/servicenow/patch_state.py

  # JOB 2: Deploy Application
  deploy_application:
    name: Deploy to ${{ inputs.env }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USERNAME: ${{ secrets.SN_USERNAME }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
    needs: 
      - create_snow_change
    if: always() # runs for all envs but only creates change for prod
    outputs:
      implement_task_sysid: ${{ steps.get_task.outputs.implement_task_sysid }}
    steps:
      - uses: actions/checkout@v4   

      - name: Setup Python
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - name: Move Change to Implement
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        env:
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
          SN_TARGET_STATE: "-1"
        run: |
          pip install -r requirements.txt
          python scripts/servicenow/patch_state.py
      
      - name: Get Implement task
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        id: get_task
        env:
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
        run: python scripts/servicenow/get_tasks.py
      
      - name: Parse CHANGELOG
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        id: parse_changelog
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/evidence/parse_changelog.py
      
      - name: Fill DOCX template (DRAFT)
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        env:
          CHG_NUMBER: ${{ needs.create_snow_change.outputs.chg_number }}
          CHG_DESCRIPTION: ${{ needs.create_snow_change.outputs.chg_description }}
          BACKEND_SCOPE: ${{ steps.parse_changelog.outputs.backend_scope }}
          DATA_SCOPE: ${{ steps.parse_changelog.outputs.data_scope }}
          FRONTEND_SCOPE: ${{ steps.parse_changelog.outputs.frontend_scope }}
        run: python scripts/evidence/fill_template.py
      
      - name: Store DRAFT in document store
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        id: store_upload
        env:
          USE_SHAREPOINT: ${{ inputs.use_sharepoint }}
          CHG_NUMBER: ${{ needs.create_snow_change.outputs.chg_number }}
          LOCAL_FILE_PATH: Service_Validation_And_Testing_DRAFT.docx
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_SITE_URL: ${{ secrets.SP_SITE_URL }}
        run: python scripts/sharepoint/store_upload.py
      
      - name: Upload DRAFT to artifact (SharePoint simulation)
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' && inputs.use_sharepoint == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-testing-draft
          path: Service_Validation_And_Testing_DRAFT.docx
          retention-days: 5
      
      - name: Notify developers
        if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' }}
        run: |
          echo "### ACTION REQUIRED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "DRAFT template has been created and stored." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Store link:** ${{ steps.store_upload.outputs.store_link }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** SharePoint is currently simulated. In the real implementation, this will be a SharePoint folder per change (e.g., ${{ needs.create_snow_change.outputs.chg_number }})." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Once completed, approve the **Finalize** stage below to attach the document to ServiceNow." >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "DRAFT template stored: ${{ steps.store_upload.outputs.store_link }}"
          echo "After completing the template, approve the 'Finalize' stage to attach it to ServiceNow"
      
      - name: "[PLACEHOLDER] Deploy Application"
        run: |
          echo "Deploying ${{ inputs.version }} to ${{ inputs.env }}..."
          sleep 2
          echo "Deployment complete"
      
  # JOB 3: Finalize
  finalize:
    name: Finalize (manual approval gate)
    needs: 
      - create_snow_change
      - deploy_application
    if: ${{ inputs.env == 'prod' && needs.create_snow_change.result == 'success' && needs.deploy_application.result == 'success' }}
    runs-on: ubuntu-latest
    environment: finalize
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USERNAME: ${{ secrets.SN_USERNAME }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - run: pip install -r requirements.txt
      
      - name: Download completed template from artifact (SharePoint simulation)
        if: ${{ inputs.use_sharepoint == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: validation-testing-draft
      
      - name: Download completed template from SharePoint
        if: ${{ inputs.use_sharepoint == 'true' }}
        env:
          USE_SHAREPOINT: ${{ inputs.use_sharepoint }}
          DOWNLOAD_TO_PATH: Service_Validation_And_Testing_DRAFT.docx
          CHG_NUMBER: ${{ needs.create_snow_change.outputs.chg_number }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_SITE_URL: ${{ secrets.SP_SITE_URL }}
        run: python scripts/sharepoint/store_download.py
      
      - name: Verify downloaded template
        if: ${{ inputs.use_sharepoint == 'false' }}
        env:
          USE_SHAREPOINT: ${{ inputs.use_sharepoint }}
          DOWNLOAD_TO_PATH: Service_Validation_And_Testing_DRAFT.docx
        run: python scripts/sharepoint/store_download.py
      
      - name: Attach completed template to ServiceNow task
        env:
          SN_TASK_SYSID: ${{ needs.deploy_application.outputs.implement_task_sysid }}
          EVIDENCE_FILE_PATH: Service_Validation_And_Testing_DRAFT.docx
        run: |
          echo "Attaching completed template to ServiceNow task..."
          python scripts/servicenow/upload_attachment.py
      
      - name: Close Implement task
        env:
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
          SN_TASK_SYSID: ${{ needs.deploy_application.outputs.implement_task_sysid }}
        run: |
          echo "Closing Implement task..."
          python scripts/servicenow/close_task.py
      
  # JOB 4: Move to Review
  move_to_review:
    name: Move Change to Review
    if: ${{ inputs.env == 'prod' && needs.finalize.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
      SN_USERNAME: ${{ secrets.SN_USERNAME }}
      SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
    needs:
      - create_snow_change
      - finalize
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      
      - run: pip install -r requirements.txt
      
      - name: Move to Review State
        continue-on-error: true
        env:
          SN_CHG_SYSID: ${{ needs.create_snow_change.outputs.chg_sysid }}
          SN_TARGET_STATE: "0"
        run: python scripts/servicenow/patch_state.py