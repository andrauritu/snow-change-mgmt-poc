name: SNOW Patch State

on:
  workflow_dispatch:
    inputs:
      chg_sysid:
        description: 'Change sys_id'
        required: true
        type: string
      target_state:
        description: 'Target state value (e.g., "-2" for Scheduled, "4" for Canceled)'
        required: true
        type: string

jobs:
  patch_state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Patch Change State
        env:
          SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
          SN_CHG_SYSID: ${{ inputs.chg_sysid }}
          SN_TARGET_STATE: ${{ inputs.target_state }}
        run: python scripts/patch_state.py
