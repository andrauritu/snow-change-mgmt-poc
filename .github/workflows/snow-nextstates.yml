name: SNOW Read Next States

on:
  workflow_dispatch:
    inputs:
      chg_sysid:
        description: 'Change sys_id (from create output)'
        required: true
        type: string

jobs:
  nextstates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Read Next States
        env:
          SN_INSTANCE: ${{ secrets.SN_INSTANCE }}
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
          SN_CHG_SYSID: ${{ inputs.chg_sysid }}
        run: python scripts/nextstates.py
